# Manual helper: checks where each third-party build dependency can be fetched from without a login, and
# reports its layout and license. Read-only; nothing is published.
name: deps-probe

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/deps-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: FidelityFX SDK 1.1.4 layout and build options
        run: |
          gh release download v1.1.4 -R GPUOpen-LibrariesAndSDKs/FidelityFX-SDK -p '*.zip' -O ffx1.zip
          unzip -q ffx1.zip -d ffx1
          root=ffx1/sdk
          echo "sdk root: $root"; ls "$root"; ls "$root/include" | head; ls "$root/bin" 2>/dev/null | head
          find ffx1 -iname '*.bat' | head
          grep -n -E 'option\(|FFX_API_BACKEND|set\(FFX_.*CACHE' "$root/CMakeLists.txt" | head -60
          find "$root/src/components/opticalflow" -maxdepth 1 | head
          grep -n -E 'add_library|OUTPUT_NAME|ffx_opticalflow' "$root/src/components/opticalflow/CMakeLists.txt" | head
          grep -rn -E 'ARCHIVE_OUTPUT_DIRECTORY|bin/ffx_sdk|_x64' "$root/CMakeLists.txt" "$root/common.cmake" 2>/dev/null | head -20
          find ffx1 -iname 'BuildFidelityFXSDK*' -exec sh -c 'echo "== $1"; head -60 "$1"' _ {} \;
