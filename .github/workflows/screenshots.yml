# Manual helper: installs a PushFPS release on a Windows runner, opens each main screen with the program's
# own startup options (--page / --tab / --dialog / --size) and saves a screenshot of the real window.
# The runner has no GPU, so NVIDIA-only controls show as unavailable, exactly as on a PC without one.
name: screenshots

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release to install; leave empty to use the latest successful build of the branch below
        default: ''
        required: false
      branch:
        description: Branch whose latest successful build-windows run is used when no release is given
        default: main
        required: false
      only:
        description: Take only the screenshots whose name matches this regular expression (empty = all)
        default: ''
        required: false
      run_id:
        description: Use the package of this build-windows run, whatever its result (design work on a build whose tests still fail)
        default: ''
        required: false
      qml_from:
        description: Put the interface files (qml/) of this branch or commit over the installed build's (design work without a rebuild; the program itself stays that build's)
        default: ''
        required: false

# contents: write only to push the images to the `screenshots` branch (replaced on every run).
permissions:
  contents: write
  actions: read

jobs:
  shots:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      BUILD_BRANCH: ${{ inputs.branch || 'main' }}
      ONLY: ${{ inputs.only }}
      QML_FROM: ${{ inputs.qml_from }}
      RUN_ID: ${{ inputs.run_id }}
    steps:
      # Only for the test-pattern sender (tools/frame-input): the screenshots that show a playing picture.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/frame-input
          path: repo

      - name: Screen resolution
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop } catch { Write-Host "Set-DisplayResolution: $_" }
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::PrimaryScreen.Bounds

      - name: Install PushFPS
        run: |
          if ($env:RELEASE_TAG) {
            gh release download $env:RELEASE_TAG -R $env:GITHUB_REPOSITORY -p 'PushFPS-[0-9]*-win64.zip' -O pf.zip
          } else {
            $run = $env:RUN_ID
            if (-not $run) { $run = gh run list -R $env:GITHUB_REPOSITORY -w build-windows -b $env:BUILD_BRANCH -s success -L 1 --json databaseId -q '.[0].databaseId' }
            if (-not $run) { throw "no successful build-windows run on $env:BUILD_BRANCH" }
            Write-Host "Using build run $run ($(if ($env:RUN_ID) { 'given' } else { $env:BUILD_BRANCH }))"
            gh run download $run -R $env:GITHUB_REPOSITORY -p 'PushFPS-*' -D art
            Move-Item (Get-ChildItem art -Recurse -Filter 'PushFPS-*-win64.zip' | Where-Object Name -notlike '*OBS*' | Select-Object -First 1).FullName pf.zip
          }
          Expand-Archive pf.zip -DestinationPath pf
          & .\pf\Install-PushFPS.ps1 -Gpu NVIDIA -InstallDir D:\pf -NoShortcuts -NoLaunch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The interface is loaded from disk next to the program, so another commit's qml/ can be laid over it.
      # Only what the installed program already offers works behind it (a new preference needs a new build).
      - name: Interface files of another commit (optional)
        if: ${{ inputs.qml_from != '' }}
        run: |
          git init -q qmlsrc
          git -C qmlsrc remote add origin "https://x-access-token:$($env:GH_TOKEN)@github.com/$($env:GITHUB_REPOSITORY).git"
          git -C qmlsrc sparse-checkout set qml
          git -C qmlsrc fetch -q --depth 1 origin $env:QML_FROM
          if ($LASTEXITCODE -ne 0) { throw "could not fetch $env:QML_FROM" }
          git -C qmlsrc checkout -q FETCH_HEAD
          Copy-Item qmlsrc\qml\Veyra\* D:\pf\qml\Veyra -Recurse -Force
          Write-Host "Interface files from $env:QML_FROM ($(git -C qmlsrc rev-parse --short HEAD)) laid over the installed build"

      - name: Take screenshots
        run: |
          Add-Type -AssemblyName System.Drawing, System.Windows.Forms
          Add-Type @'
          using System; using System.Runtime.InteropServices;
          public static class W {
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int L, T, R, B; }
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
            [DllImport("user32.dll")] public static extern bool SetProcessDPIAware();
          }
          '@
          [W]::SetProcessDPIAware() | Out-Null
          $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $w = [Math]::Min(1440, $screen.Width - 40); $h = [Math]::Min(900, $screen.Height - 60)
          New-Item -ItemType Directory -Force shots | Out-Null
          # 1-6 and 10 are the README screens; 7-9 and 11 check the layout at small window sizes and other pages.
          $list = @(
            @{ name = '1-home';            args = @('--page', 'home', '--dock-pinned') },
            @{ name = '2-frame-generation'; args = @('--page', 'pro', '--tab', 'fg') },
            @{ name = '3-capture-card';    args = @('--page', 'home', '--dialog', 'capture') },
            @{ name = '4-picture';         args = @('--page', 'pro', '--tab', 'quality') },
            @{ name = '5-display';         args = @('--page', 'pro', '--tab', 'display') },
            @{ name = '6-settings';        args = @('--page', 'set') },
            @{ name = '7-home-small';      args = @('--page', 'home'); size = '1100x680' },
            @{ name = '8-pro-small';       args = @('--page', 'pro', '--tab', 'fg'); size = '1100x680' },
            @{ name = '9-cinema';          args = @('--page', 'min', '--dock-pinned') },
            @{ name = '10-picture-sound';  args = @('--page', 'home', '--tab', 'tuning') },
            @{ name = '11-pro-audio';      args = @('--page', 'pro', '--tab', 'audio') },
            @{ name = '12-optimize';       args = @('--page', 'home', '--dialog', 'optimize') },
            @{ name = '13-game-presets';   args = @('--page', 'home', '--dialog', 'games') },
            @{ name = '14-settings-playback'; args = @('--page', 'set') },
            # Appearance modes and languages: every text must stay readable.
            @{ name = '15-light-home';     args = @('--page', 'home', '--dock-pinned', '--theme', 'light') },
            @{ name = '16-light-pro';      args = @('--page', 'pro', '--tab', 'fg', '--theme', 'light') },
            @{ name = '17-light-settings'; args = @('--page', 'set', '--theme', 'light') },
            @{ name = '18-light-optimize'; args = @('--page', 'home', '--dialog', 'optimize', '--theme', 'light') },
            @{ name = '19-light-node';     args = @('--page', 'node', '--theme', 'light') },
            @{ name = '20-light-picture';  args = @('--page', 'home', '--tab', 'tuning', '--theme', 'light') },
            @{ name = '21-black-home';     args = @('--page', 'home', '--dock-pinned', '--theme', 'black') },
            @{ name = '22-black-pro';      args = @('--page', 'pro', '--tab', 'quality', '--theme', 'black') },
            @{ name = '23-black-games';    args = @('--page', 'home', '--dialog', 'games', '--theme', 'black') },
            @{ name = '24-lang-de';        args = @('--page', 'home', '--lang', 'de') },
            @{ name = '25-lang-ar';        args = @('--page', 'home', '--lang', 'ar') },
            @{ name = '26-lang-es-pro';    args = @('--page', 'pro', '--tab', 'fg', '--lang', 'es') },
            @{ name = '27-lang-tr';        args = @('--page', 'set', '--lang', 'tr') },
            @{ name = '28-lang-nl';        args = @('--page', 'home', '--lang', 'nl') },
            @{ name = '29-settings-anr';   args = @('--page', 'set', '--tab', 'comp') },
            @{ name = '30-settings-about'; args = @('--page', 'set', '--tab', 'about') },
            @{ name = '31-light-about';    args = @('--page', 'set', '--tab', 'about', '--theme', 'light') },
            @{ name = '32-settings-recording'; args = @('--page', 'set', '--tab', 'rec', '--scroll-to', 'set-recbitrate') },
            @{ name = '33-recording-advanced'; args = @('--page', 'set', '--tab', 'rec', '--scroll-to', 'set-recadvanced', '--pref', 'recordAdvanced=true', '--pref', 'recordRateControl=2') },
            @{ name = '34-recording-advanced-light'; args = @('--page', 'set', '--tab', 'rec', '--scroll-to', 'set-recadvanced', '--theme', 'light', '--pref', 'recordAdvanced=true') },
            @{ name = '35-hud-protection'; args = @('--page', 'home', '--dialog', 'hud') },
            @{ name = '36-hud-protection-light'; args = @('--page', 'home', '--dialog', 'hud', '--theme', 'light') },
            @{ name = '37-hud-protection-de'; args = @('--page', 'home', '--dialog', 'hud', '--lang', 'de') },
            @{ name = '38-recording-help'; args = @('--page', 'set', '--tab', 'rec', '--scroll-to', 'set-recadvanced', '--pref', 'recordAdvanced=true', '--pref', 'recordRateControl=2', '--lang', 'en') },
            @{ name = '39-ps5-streaming'; args = @('--page', 'home', '--dialog', 'ps5') },
            @{ name = '40-pc-streaming';  args = @('--page', 'home', '--dialog', 'moonlight') },
            @{ name = '41-xbox-streaming'; args = @('--page', 'home', '--dialog', 'xbox') },
            @{ name = '42-latency-guide'; args = @('--page', 'home', '--dialog', 'latencyguide') },
            @{ name = '43-intro-chevrons'; args = @('--page', 'home', '--intro-at', '700') },
            @{ name = '44-intro-sunset'; args = @('--page', 'home', '--intro-at', '2300') },
            @{ name = '45-intro-glide'; args = @('--page', 'home', '--intro-at', '3000') },
            @{ name = '46-home-classic'; args = @('--page', 'home', '--pref', 'pushSunset=false') },
            @{ name = '47-switch2-presets'; args = @('--page', 'home', '--dialog', 'games', '--pref', 'pushConsole=switch2') },
            # README screens in the PushFPS brand (the Sunset City logo is for the app and website only).
            @{ name = '48-home-classic-light'; args = @('--page', 'home', '--dock-pinned', '--theme', 'light', '--pref', 'pushSunset=false') },
            @{ name = '49-home-classic-black'; args = @('--page', 'home', '--dock-pinned', '--theme', 'black', '--pref', 'pushSunset=false') },
            @{ name = '50-home-classic-pinned'; args = @('--page', 'home', '--dock-pinned', '--pref', 'pushSunset=false') },
            # Going live (2.9.0): three outputs, the way a multistream setup looks before going live. Start-Process
            # does not escape quotes, so the JSON carries \" for the Windows command line.
            @{ name = '51-go-live'; args = @('--page', 'home', '--dialog', 'stream', '--lang', 'en', '--pref', ('streamTargets=' + '[{"id":"o1","platform":"twitch","name":"","server":"","enabled":true},{"id":"o2","platform":"youtube","name":"","server":"","enabled":true},{"id":"o3","platform":"kick","name":"","server":"","enabled":false}]'.Replace('"', '\"'))) },
            @{ name = '52-optimize-goals'; args = @('--page', 'home', '--dialog', 'optimize', '--lang', 'en', '--pref', 'pushOptimizeGoal=balanced') },
            # PushFPS 3.0/3.1 modes: streaming mode (classic and sunset), video playback mode, the comparison dialog's vertical layout.
            @{ name = '60-streaming-mode'; args = @('--page', 'live', '--lang', 'en', '--pref', 'pushSunset=false') },
            @{ name = '61-video-playback'; args = @('--page', 'watch', '--lang', 'en', '--pref', 'pushSunset=false') },
            @{ name = '62-compare-vertical'; args = @('--page', 'home', '--dialog', 'compare', '--lang', 'en', '--pref', 'pushCompareLayout=2', '--pref', 'pushSunset=false') },
            @{ name = '63-streaming-mode-sunset'; args = @('--page', 'live', '--lang', 'en') },
            # PushFPS 3.2: the layout editor with a webcam on a game scene, the stream dialog with a platform
            # preset, a vertical TikTok LIVE layout, and the recording upload presets.
            @{ name = '64-layout-editor'; args = @('--page', 'live', '--dialog', 'layout', '--lang', 'en', '--pref', ('studioScenes=' + '[{"id":"game","name":"Game","type":"game","sources":[{"id":"c1","kind":"camera","target":"cam","name":"Webcam","corner":"custom","x":0.72,"y":0.62,"size":0.25,"shape":"round"}]},{"id":"brb","name":"Be right back","type":"card","title":"Be right back"}]'.Replace('"', '\"'))) },
            @{ name = '65-layout-vertical'; args = @('--page', 'live', '--dialog', 'layout', '--lang', 'en', '--pref', 'streamWidth=1080', '--pref', 'streamHeight=1920', '--pref', 'canvasY=300', '--pref', ('studioScenes=' + '[{"id":"game","name":"Game","type":"game","sources":[{"id":"c1","kind":"camera","target":"cam","name":"Webcam","corner":"custom","x":0.1,"y":0.04,"size":0.8,"shape":"round"}]}]'.Replace('"', '\"'))) },
            @{ name = '66-stream-presets'; args = @('--page', 'live', '--dialog', 'stream', '--lang', 'en', '--pref', 'streamProfile=youtube-1080p60', '--pref', 'streamWidth=1920', '--pref', 'streamHeight=1080', '--pref', 'streamBitrateKbps=17000', '--pref', 'streamAudioKbps=128', '--pref', 'streamFps=60', '--pref', ('streamTargets=' + '[{"id":"o1","platform":"youtube","name":"","server":"","enabled":true}]'.Replace('"', '\"'))) },
            @{ name = '67-recording-presets'; args = @('--page', 'set', '--tab', 'play', '--lang', 'en', '--scroll-to', 'set-recprofile', '--pref', 'recordProfile=shorts-60', '--pref', 'recordWidth=1080', '--pref', 'recordHeight=1920', '--pref', 'recordFit=1', '--pref', 'recordFps=60', '--pref', 'recordBitrateKbps=12000', '--pref', 'recordAdvanced=true', '--pref', 'recordAudioKbps=320', '--pref', 'recordKeyframe=1', '--pref', 'recordPreset=5') },
            @{ name = '68-quality-test'; args = @('--page', 'pro', '--dialog', 'qualitytest', '--lang', 'en', '--pref', 'pushSunset=false') },
            @{ name = '69-latency-test'; args = @('--page', 'live', '--dialog', 'latencytest', '--lang', 'en', '--pref', 'pushSunset=false') },
            @{ name = '70-frame-input'; args = @('--page', 'home', '--dialog', 'frameinput', '--lang', 'en', '--pref', 'pushSunset=false') },
            @{ name = '71-about'; args = @('--page', 'set', '--tab', 'about', '--lang', 'en', '--pref', 'pushSunset=false') },
            # 3.2.2. A playing picture (the Frame Input test pattern, 16:9) in a cinema window held at 2.39:1
            # (--aspect; without it the window follows the picture's shape and there are no bars to fill):
            # ambient fill in the bars, and the same with plain bars. Then the fill row on the home page.
            @{ name = '72-ambient-fill'; sender = $true; size = '1280x536'; args = @('frameinput:default', '--page', 'min', '--aspect', '2.39', '--pref', 'pushAmbientFill=true', '--pref', 'pushSunset=false') },
            @{ name = '73-black-bars'; sender = $true; size = '1280x536'; args = @('frameinput:default', '--page', 'min', '--aspect', '2.39', '--pref', 'pushAmbientFill=false', '--pref', 'pushSunset=false') },
            @{ name = '74-wide-screen-fill'; args = @('--page', 'home', '--scroll-to', 'pushfps-fill-row', '--lang', 'en', '--pref', 'pushAmbientFill=true', '--pref', 'pushSunset=false') },
            # The crash notice: the note the crash handler would have left, written before the start.
            @{ name = '75-crash-notice'; crash = $true; args = @('--page', 'home', '--lang', 'en', '--pref', 'pushSunset=false') },
            @{ name = '76-card-test'; args = @('--page', 'home', '--dialog', 'cardtest', '--lang', 'en', '--pref', 'pushSunset=false') },
            @{ name = '77-settings-card-test'; args = @('--page', 'set', '--tab', 'about', '--scroll-to', 'set-cardtest', '--lang', 'en', '--pref', 'pushSunset=false') },
            # Comparison clips (3.2.5): the Reveal layout with its sweep interval, and the clip quality of a split clip.
            @{ name = '78-compare-reveal'; args = @('--page', 'home', '--dialog', 'compare', '--lang', 'en', '--pref', 'pushCompareLayout=3', '--pref', 'pushSunset=false') },
            @{ name = '79-compare-split-quality'; args = @('--page', 'home', '--dialog', 'compare', '--lang', 'en', '--pref', 'pushCompareLayout=0', '--pref', 'pushCompareQuality=2160', '--pref', 'pushSunset=false') },
            @{ name = '80-settings-performance-report'; args = @('--page', 'set', '--tab', 'about', '--scroll-to', 'set-perfreport', '--lang', 'en', '--pref', 'pushSunset=false') },
            # Crop and resize of the console picture (3.2.6). 81: the test pattern with a fifth cut from the left and the right and a
            # tenth from the top (the kept part centred, the rest black); 82: the same picture whole, to compare; 83: the editor;
            # 84: the quick setup row. Look at the kept part's first and last columns and rows: they must show the picture and
            # nothing else (an edge through a 2 x 2 pixel block once left stray pixels there).
            @{ name = '81-crop-playing'; sender = $true; size = '1280x720'; args = @('frameinput:default', '--page', 'min', '--pref', 'pushCropOn=true', '--pref', 'pushCropL=200', '--pref', 'pushCropR=200', '--pref', 'pushCropT=100', '--pref', 'pushSunset=false') },
            @{ name = '82-crop-off-playing'; sender = $true; size = '1280x720'; args = @('frameinput:default', '--page', 'min', '--pref', 'pushCropOn=false', '--pref', 'pushCropL=200', '--pref', 'pushCropR=200', '--pref', 'pushCropT=100', '--pref', 'pushSunset=false') },
            # 85: a smaller picture moved off centre with odd shares cut, so all four edges of the kept part lie inside the window.
            @{ name = '85-crop-small-playing'; sender = $true; size = '1280x720'; args = @('frameinput:default', '--page', 'min', '--pref', 'pushCropOn=true', '--pref', 'pushCropL=131', '--pref', 'pushCropT=73', '--pref', 'pushCropB=41', '--pref', 'pushCropZoom=77', '--pref', 'pushCropX=-83', '--pref', 'pushCropY=37', '--pref', 'pushSunset=false') },
            # 86 / 87: the on-screen latency readout over a playing picture, in its corner and where a user dragged it to
            # (the bottom right). The picture must show all round it: the video window is cut out under it wherever it sits.
            @{ name = '86-latency-corner-playing'; sender = $true; size = '1280x720'; args = @('frameinput:default', '--page', 'min', '--lang', 'en', '--pref', 'pushLatencyOverlay=true', '--pref', 'pushSunset=false') },
            @{ name = '87-latency-moved-playing'; sender = $true; size = '1280x720'; args = @('frameinput:default', '--page', 'min', '--lang', 'en', '--pref', 'pushLatencyOverlay=true', '--pref', 'pushLatencyX=1000', '--pref', 'pushLatencyY=1000', '--pref', 'pushSunset=false') },
            # 88: the live split comparison over a playing picture. A white line between two dark edges must stand where
            # the two sides meet, from the picture's top to its bottom.
            @{ name = '88-compare-line-playing'; sender = $true; size = '1280x720'; args = @('frameinput:default', '--page', 'min', '--lang', 'en', '--compare', '0.4', '--pref', 'pushSunset=false') },
            # PushFPS 4.0: the record dialog (PushRecordDialog), wide at the standard rate and tall, filled.
            @{ name = '89-record-dialog'; args = @('--page', 'home', '--dialog', 'record', '--lang', 'en', '--pref', 'pushSunset=false') },
            @{ name = '90-record-dialog-vertical'; args = @('--page', 'home', '--dialog', 'record', '--lang', 'en', '--pref', 'recordWidth=1080', '--pref', 'recordHeight=1920', '--pref', 'recordFit=1', '--pref', 'pushSunset=false') },
            # PushFPS 4.1: the maximise button in the headers of Professional and Streaming mode, and the quick setup
            # rows every card has now (the method where more than one is offered, the low latency switch).
            @{ name = '91-pro-maximize'; args = @('--page', 'pro', '--lang', 'en', '--pref', 'pushSunset=false') },
            @{ name = '92-studio-maximize'; args = @('--page', 'live', '--lang', 'en', '--pref', 'pushSunset=false') },
            @{ name = '93-quick-method'; args = @('--page', 'home', '--scroll-to', 'pushfps-fg-backend-row', '--lang', 'en', '--pref', 'pushSunset=false') },
            @{ name = '94-quick-low-latency'; args = @('--page', 'home', '--scroll-to', 'pushfps-low-latency-row', '--lang', 'en', '--pref', 'pushSunset=false') },
            # 95: the comparison clip dialog names the console chosen in quick setup; 96: the enhancement's size row
            # (shown where the enhancement can run, so on the runner it may be scrolled to and absent).
            @{ name = '95-compare-console-name'; args = @('--page', 'home', '--dialog', 'compare', '--lang', 'en', '--pref', 'pushConsole=ps5pro', '--pref', 'pushSunset=false') },
            @{ name = '96-quick-smooth-screen'; args = @('--page', 'home', '--scroll-to', 'pushfps-smooth-row', '--lang', 'en', '--pref', 'pushSunset=false') },
            @{ name = '83-crop-editor'; args = @('--page', 'home', '--dialog', 'crop', '--lang', 'en', '--pref', 'pushCropOn=true', '--pref', 'pushCropT=119', '--pref', 'pushCropB=119', '--pref', 'pushSunset=false') },
            @{ name = '84-crop-quick-setup'; args = @('--page', 'home', '--scroll-to', 'pushfps-crop-row', '--lang', 'en', '--pref', 'pushCropOn=true', '--pref', 'pushCropT=119', '--pref', 'pushCropB=119', '--pref', 'pushSunset=false') },
            # The interface in sections, the three pages the quick setup stands in, and the colours (after 4.1).
            @{ name = '97-home-sections'; args = @('--page', 'home', '--lang', 'en', '--pref', 'pushSunset=false', '--scroll-to', 'pushfps-tools-row') },
            @{ name = '98-home-sections-picture'; args = @('--page', 'home', '--lang', 'en', '--pref', 'pushSunset=false', '--scroll-to', 'pushfps-enhance-row') },
            @{ name = '99-pro-sections'; args = @('--page', 'pro', '--tab', 'fg', '--lang', 'en') },
            @{ name = '100-streaming-sections'; args = @('--page', 'live', '--lang', 'en') },
            @{ name = '101-appearance'; args = @('--page', 'set', '--lang', 'en') },
            @{ name = '102-midnight-home'; args = @('--page', 'home', '--lang', 'en', '--theme', 'midnight', '--pref', 'pushSunset=false', '--dock-pinned') },
            @{ name = '103-plum-pro'; args = @('--page', 'pro', '--tab', 'fg', '--lang', 'en', '--theme', 'plum') },
            @{ name = '104-forest-settings'; args = @('--page', 'set', '--lang', 'en', '--theme', 'forest') },
            @{ name = '105-midnight-ice'; args = @('--page', 'home', '--lang', 'en', '--theme', 'midnight', '--pref', 'accent=ice', '--pref', 'pushSunset=false', '--dock-pinned') },
            @{ name = '106-light-rose-settings'; args = @('--page', 'set', '--lang', 'en', '--theme', 'light', '--pref', 'accent=rose') },
            @{ name = '107-capture-help'; args = @('--page', 'home', '--dialog', 'capture', '--lang', 'en') },
            @{ name = '108-settings-recording-page'; args = @('--page', 'set', '--tab', 'rec', '--lang', 'en') },
            @{ name = '109-settings-playback-page'; args = @('--page', 'set', '--tab', 'play', '--lang', 'en') },
            # 4.1's later parts: Check my setup (with nothing playing, and over the playing test pattern), the six
            # tool tiles, the high-contrast look, the record dialog with the vertical copy, local control's group,
            # and the readout in its largest size over a playing picture.
            @{ name = '110-check-my-setup-idle'; args = @('--page', 'home', '--dialog', 'diagnose', '--lang', 'en', '--pref', 'pushSunset=false') },
            @{ name = '111-check-my-setup-playing'; sender = $true; size = '1280x720'; args = @('frameinput:default', '--page', 'min', '--dialog', 'diagnose', '--lang', 'en', '--pref', 'pushSunset=false') },
            @{ name = '112-home-tools'; args = @('--page', 'home', '--lang', 'en', '--pref', 'pushSunset=false', '--scroll-to', 'pushfps-tools-row') },
            @{ name = '113-contrast-home'; args = @('--page', 'home', '--lang', 'en', '--theme', 'contrast', '--pref', 'pushSunset=false', '--dock-pinned') },
