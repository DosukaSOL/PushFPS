            @{ name = 'R-legacy'; size = '1440x900'; args = @('--page', 'home', '--lang', 'en', '--pref', 'pushDesign=legacy', '--pref', 'pushSunset=false') },
            @{ name = 'R-sides-folded'; size = '1440x900'; args = @('--page', 'home', '--lang', 'en', '--pref', 'pushSideCollapsed=true', '--pref', 'pushNavCollapsed=true') },
            @{ name = 'R-pro-folded'; size = '1440x900'; args = @('--page', 'pro', '--lang', 'en', '--pref', 'pushProFolded=quality,fg,audio') },
            # The mouse and keyboard setup video (scratch branch video/kbm-guide, never merged).
            @{ name = 'G-00-warmup'; size = '1600x900'; args = @('--page', 'home', '--lang', 'en') },
            @{ name = 'G-01-home-off'; size = '1600x900'; args = @('--page', 'home', '--lang', 'en', '--scroll-to', 'pushfps-kbm-row', '--pref', ('pushKbm=' + '{"on":false,"preset":"gta6"}'.Replace('"', '\"'))) },
            @{ name = 'G-02-home-ready'; size = '1600x900'; args = @('--page', 'home', '--lang', 'en', '--scroll-to', 'pushfps-kbm-row', '--scratch-kbm-ready', '--pref', ('pushKbm=' + '{"on":true,"preset":"gta6"}'.Replace('"', '\"'))) },
            @{ name = 'G-03-capture-turnon'; sender = $true; size = '1600x900'; env = @{ VEYRA_TEST_PS5_CONTROL_ANY_SOURCE = '1' }; args = @('frameinput:default', '--page', 'home', '--lang', 'en', '--scroll-to', 'pushfps-kbm-row', '--scratch-kbm-paired', '--pref', ('pushKbm=' + '{"on":true,"preset":"gta6"}'.Replace('"', '\"'))) },
            @{ name = 'G-04-capture-pair'; sender = $true; size = '1600x900'; env = @{ VEYRA_TEST_PS5_CONTROL_ANY_SOURCE = '1' }; args = @('frameinput:default', '--page', 'home', '--lang', 'en', '--scroll-to', 'pushfps-kbm-row', '--pref', ('pushKbm=' + '{"on":true,"preset":"gta6"}'.Replace('"', '\"'))) },
            @{ name = 'G-05-kbm'; size = '1600x900'; args = @('--page', 'home', '--dialog', 'kbm', '--lang', 'en', '--scratch-kbm-ready', '--pref', ('pushKbm=' + '{"on":true,"preset":"gta6"}'.Replace('"', '\"'))) },
            @{ name = 'G-06-kbm-keys'; size = '1600x900'; args = @('--page', 'home', '--dialog', 'kbm', '--lang', 'en', '--scroll-to', 'pushfps-kbm-row-cross', '--scratch-kbm-ready', '--pref', ('pushKbm=' + '{"on":true,"preset":"gta6"}'.Replace('"', '\"'))) },
            @{ name = 'G-07-kbm-waiting'; size = '1600x900'; args = @('--page', 'home', '--dialog', 'kbm', '--lang', 'en', '--pref', ('pushKbm=' + '{"on":true,"preset":"gta6"}'.Replace('"', '\"'))) }
          )
          if ($env:ONLY) { $list = @($list | Where-Object { $_.name -match $env:ONLY }); Write-Host "Only: $($list.name -join ', ')" }
          foreach ($s in $list) {
            $data = "D:\pfdata\$($s.name)"
            $size = if ($s.size) { $s.size } else { "${w}x${h}" }
            $a = $s.args + @('--size', $size, '--data-dir', $data, '--reduced-motion', '--no-update-check')
            # SCRATCH (video/kbm-guide): an entry's own environment, for the program's test switches.
            $envSet = @()
            if ($s.env) { foreach ($k in $s.env.Keys) { [Environment]::SetEnvironmentVariable($k, $s.env[$k], 'Process'); $envSet += $k } }
            $sender = $null
            if ($s.sender) {
              $sender = Start-Process python -ArgumentList @('repo\tools\frame-input\send_test_pattern.py', '--width', '1280', '--height', '720', '--fps', '30') -PassThru -WindowStyle Hidden
              Start-Sleep -Seconds 3
            }
            if ($s.crash) {
              # pushfps-last-failure.txt as apps/veyra-qml/main.cpp writes it (UTF-16), and the session note beside it.
              New-Item -ItemType Directory -Force D:\pf\logs | Out-Null
              $note = "crash onnxruntime.dll`n`ncode=0xC0000005 offset=0x11B640 dump=pushfps-crash-20261118-211405-1234.dmp time=2026-11-18 21:14`n"
              [System.IO.File]::WriteAllBytes('D:\pf\logs\pushfps-last-failure.txt', [System.Text.Encoding]::Unicode.GetBytes($note))
              [System.IO.File]::WriteAllText('D:\pf\logs\pushfps-last-session.txt', 'source=xbox size=1920x1080 fg=pushflow_3X_fast nr=1 sr=0 hdr=0')
            }
            $p = Start-Process D:\pf\PushFPS.exe -ArgumentList $a -PassThru
            Start-Sleep -Seconds $(if ($s.sender) { 20 } else { 14 })
            $p.Refresh()
            $hwnd = $p.MainWindowHandle
            if ($p.HasExited -or $hwnd -eq [IntPtr]::Zero) {
              Write-Host "::warning::$($s.name): no window"
              # Why: whether the program is gone, the failure note its crash handler leaves, and what its log last said.
              Write-Host "exited=$($p.HasExited) code=$(if ($p.HasExited) { '0x{0:X8}' -f $p.ExitCode } else { 'still running' })"
              if (Test-Path D:\pf\logs\pushfps-last-failure.txt) { Get-Content D:\pf\logs\pushfps-last-failure.txt -Encoding Unicode | Out-Host }
              Get-ChildItem D:\pf\logs -Filter *.log -ErrorAction SilentlyContinue | Sort-Object LastWriteTime | Select-Object -Last 1 | Get-Content -Tail 45 | Out-Host
              if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
              if ($sender -and -not $sender.HasExited) { Stop-Process -Id $sender.Id -Force }
              continue
            }
            $r = New-Object W+RECT; [W]::GetWindowRect($hwnd, [ref]$r) | Out-Null
            # The pointer rests in the window's bottom left corner, where nothing reacts to it: wherever the
            # runner left it, a tooltip or a hover edge would be in the picture.
            try { [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point(($r.L + 3), ($r.B - 4)) } catch { Write-Host "pointer: $_" }
            [W]::SetForegroundWindow($hwnd) | Out-Null; Start-Sleep -Milliseconds 800
            $bw = $r.R - $r.L; $bh = $r.B - $r.T
            $bmp = New-Object System.Drawing.Bitmap $bw, $bh
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($r.L, $r.T, 0, 0, $bmp.Size)
            $bmp.Save("shots\$($s.name).png", [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
            Write-Host "$($s.name): ${bw}x${bh}"
            Stop-Process -Id $p.Id -Force
            if ($sender -and -not $sender.HasExited) { Stop-Process -Id $sender.Id -Force }
            foreach ($k in $envSet) { [Environment]::SetEnvironmentVariable($k, $null, 'Process') }
            Start-Sleep -Seconds 2
          }
          Get-ChildItem shots | Format-Table Name, Length
          # SCRATCH (video/kbm-guide): what the mouse and keyboard bridge logged in those runs.
          Get-ChildItem D:\pf\logs -Filter *.log -ErrorAction SilentlyContinue | Get-Content | Where-Object { $_ -match 'kbm|remoteplay-control' } |
            Select-Object -First 200 | Set-Content shots\kbm-log.txt
          Get-Content shots\kbm-log.txt | Out-Host

      - name: Interface errors and warnings during the screenshot runs
        run: |
          $lines = Get-ChildItem D:\pf\logs -Filter *.log -ErrorAction SilentlyContinue | Get-Content |
            Where-Object { $_ -match '\[qml\]' -and $_ -match 'ERROR|TypeError|ReferenceError|Binding loop|Cannot assign|Unable to assign|is not a function|undefined' }
          $lines | Select-Object -Unique | Set-Content shots\qml-report.txt
          if ($lines) { Write-Host "::warning::$(@($lines).Count) interface warnings, see qml-report.txt"; $lines | Select-Object -Unique -First 80 | Out-Host }
          else { 'No QML errors or warnings in any screenshot run.' | Set-Content shots\qml-report.txt; Write-Host 'No QML errors or warnings.' }

      - name: Publish to the screenshots branch
        # The full set replaces the `screenshots` branch. A subset (input "only") is for looking at: it goes
        # to `screenshots-preview`, so it never replaces the full set.
        run: |
          $branch = if ($env:ONLY) { 'screenshots-preview' } else { 'screenshots' }
          Set-Location shots
          git init -q -b $branch
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com add *.png qml-report.txt
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -q -m "PushFPS screenshots"
          git push -q --force "https://x-access-token:$env:GH_TOKEN@github.com/$env:GITHUB_REPOSITORY.git" $branch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: pushfps-screenshots
          path: shots/*
          if-no-files-found: error
