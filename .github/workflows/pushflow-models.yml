# PushFlow model preparation on its own (a few minutes, no Windows build): downloads the pinned runtime
# packages and RIFE models, adds the grid and mask outputs, runs the CPU checks and prints models.json.
# The Windows build runs the same script; this is for working on the models quickly.
name: pushflow-models
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  models:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare and check the models
        run: |
          python -m venv /tmp/pf && /tmp/pf/bin/python -m pip install --disable-pip-version-check -q onnx==1.17.0 onnxconverter-common==1.14.0 onnxruntime==1.20.1 numpy==1.26.4
          /tmp/pf/bin/python -I scripts/pushflow/prepare_runtime.py --out /tmp/pushflow --study
          cat /tmp/pushflow/runtime/pushflow/models.json
  # The matting model of Character Hold (scripts/pushflow/prepare_matte.py): prepared, checked on the processor
  # against the published model, and run under the DirectML provider on a Windows runner (the software renderer
  # there), with the onnxruntime-directml wheel of the pinned ONNX Runtime version.
  matte:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare the matting model and check it on the processor
        shell: pwsh
        run: |
          python -m venv "$env:RUNNER_TEMP\pm"
          $py = "$env:RUNNER_TEMP\pm\Scripts\python.exe"
          & $py -m pip install --disable-pip-version-check -q onnx==1.17.0 onnxruntime-directml==1.20.1 numpy==1.26.4
          if ($LASTEXITCODE -ne 0) { exit 1 }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\matte\runtime\pushflow\models" | Out-Null
          & $py -I scripts/pushflow/prepare_matte.py --out "$env:RUNNER_TEMP\matte"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Run it under DirectML
        shell: pwsh
        run: |
          $py = "$env:RUNNER_TEMP\pm\Scripts\python.exe"
          & $py -I scripts/pushflow/check_matte_directml.py "$env:RUNNER_TEMP\matte\runtime\pushflow\models\pushmatte.onnx"
          if ($LASTEXITCODE -ne 0) { exit 1 }
