# Manual helper: installs a PushFPS release on a Windows runner, opens each main screen with the program's
# own startup options (--page / --tab / --dialog / --size) and saves a screenshot of the real window.
# The runner has no GPU, so NVIDIA-only controls show as unavailable, exactly as on a PC without one.
name: screenshots

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release to install; leave empty to use the latest successful build of the branch below
        default: ''
        required: false
      branch:
        description: Branch whose latest successful build-windows run is used when no release is given
        default: main
        required: false

# contents: write only to push the images to the `screenshots` branch (replaced on every run).
permissions:
  contents: write
  actions: read

jobs:
  shots:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      BUILD_BRANCH: ${{ inputs.branch || 'main' }}
    steps:
      - name: Screen resolution
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop } catch { Write-Host "Set-DisplayResolution: $_" }
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::PrimaryScreen.Bounds

      - name: Install PushFPS
        run: |
          if ($env:RELEASE_TAG) {
            gh release download $env:RELEASE_TAG -R $env:GITHUB_REPOSITORY -p 'PushFPS-*-win64.zip' -O pf.zip
          } else {
            $run = gh run list -R $env:GITHUB_REPOSITORY -w build-windows -b $env:BUILD_BRANCH -s success -L 1 --json databaseId -q '.[0].databaseId'
            if (-not $run) { throw "no successful build-windows run on $env:BUILD_BRANCH" }
            Write-Host "Using build run $run ($env:BUILD_BRANCH)"
            gh run download $run -R $env:GITHUB_REPOSITORY -p 'PushFPS-*' -D art
            Move-Item (Get-ChildItem art -Recurse -Filter 'PushFPS-*-win64.zip' | Select-Object -First 1).FullName pf.zip
          }
          Expand-Archive pf.zip -DestinationPath pf
          & .\pf\Install-PushFPS.ps1 -Gpu NVIDIA -InstallDir D:\pf -NoShortcuts -NoLaunch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Take screenshots
        run: |
          Add-Type -AssemblyName System.Drawing, System.Windows.Forms
          Add-Type @'
          using System; using System.Runtime.InteropServices;
          public static class W {
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int L, T, R, B; }
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
            [DllImport("user32.dll")] public static extern bool SetProcessDPIAware();
          }
          '@
          [W]::SetProcessDPIAware() | Out-Null
          $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $w = [Math]::Min(1440, $screen.Width - 40); $h = [Math]::Min(900, $screen.Height - 60)
          New-Item -ItemType Directory -Force shots | Out-Null
          # 1-6 are the README screens; 7-9 check the layout at small window sizes and other pages.
          $list = @(
            @{ name = '1-home';            args = @('--page', 'home', '--dock-pinned') },
            @{ name = '2-frame-generation'; args = @('--page', 'pro', '--tab', 'fg') },
            @{ name = '3-capture-card';    args = @('--page', 'home', '--dialog', 'capture') },
            @{ name = '4-picture';         args = @('--page', 'pro', '--tab', 'quality') },
            @{ name = '5-display';         args = @('--page', 'pro', '--tab', 'display') },
            @{ name = '6-settings';        args = @('--page', 'set') },
            @{ name = '7-home-small';      args = @('--page', 'home'); size = '1100x680' },
            @{ name = '8-pro-small';       args = @('--page', 'pro', '--tab', 'fg'); size = '1100x680' },
            @{ name = '9-cinema';          args = @('--page', 'min', '--dock-pinned') }
          )
          foreach ($s in $list) {
            $data = "D:\pfdata\$($s.name)"
            $size = if ($s.size) { $s.size } else { "${w}x${h}" }
            $a = $s.args + @('--size', $size, '--data-dir', $data, '--reduced-motion')
            $p = Start-Process D:\pf\PushFPS.exe -ArgumentList $a -PassThru
            Start-Sleep -Seconds 14
            $p.Refresh()
            $hwnd = $p.MainWindowHandle
            if ($p.HasExited -or $hwnd -eq [IntPtr]::Zero) { Write-Host "::warning::$($s.name): no window"; if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }; continue }
            [W]::SetForegroundWindow($hwnd) | Out-Null; Start-Sleep -Milliseconds 800
            $r = New-Object W+RECT; [W]::GetWindowRect($hwnd, [ref]$r) | Out-Null
            $bw = $r.R - $r.L; $bh = $r.B - $r.T
            $bmp = New-Object System.Drawing.Bitmap $bw, $bh
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($r.L, $r.T, 0, 0, $bmp.Size)
            $bmp.Save("shots\$($s.name).png", [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
            Write-Host "$($s.name): ${bw}x${bh}"
            Stop-Process -Id $p.Id -Force
            Start-Sleep -Seconds 2
          }
          Get-ChildItem shots | Format-Table Name, Length

      - name: Interface errors and warnings during the screenshot runs
        run: |
          $lines = Get-ChildItem D:\pf\logs -Filter *.log -ErrorAction SilentlyContinue | Get-Content |
            Where-Object { $_ -match '\[qml\]' -and $_ -match 'ERROR|TypeError|ReferenceError|Binding loop|Cannot assign|Unable to assign|is not a function|undefined' }
          $lines | Select-Object -Unique | Set-Content shots\qml-report.txt
          if ($lines) { Write-Host "::warning::$(@($lines).Count) interface warnings, see qml-report.txt"; $lines | Select-Object -Unique -First 80 | Out-Host }
          else { 'No QML errors or warnings in any screenshot run.' | Set-Content shots\qml-report.txt; Write-Host 'No QML errors or warnings.' }

      - name: Publish to the screenshots branch
        run: |
          Set-Location shots
          git init -q -b screenshots
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com add *.png qml-report.txt
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -q -m "PushFPS screenshots"
          git push -q --force "https://x-access-token:$env:GH_TOKEN@github.com/$env:GITHUB_REPOSITORY.git" screenshots
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: pushfps-screenshots
          path: shots/*
          if-no-files-found: error
