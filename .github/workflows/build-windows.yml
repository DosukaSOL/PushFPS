# Builds PushFPS.exe on Windows and packages the PushFPS release zip.
#
# PushFPS ships as a small overlay on Veyra's official runtime package: the installer in the zip downloads
# Veyra's NVIDIA or AMD package from Veyra's own GitHub release (checked against SHA-256 values pinned here),
# then adds PushFPS on top. PushFPS never rehosts NVIDIA / AMD / Intel runtime files. To run inside that
# package, PushFPS.exe is built against exactly the same Qt (6.8.3) and FFmpeg (9.0.1) ABI as Veyra.
#
# Every dependency below is fetched from its official public source at a pinned version; none needs a login.
# The NVIDIA Optical Flow SDK does (developer login), so this build uses AMD FidelityFX optical flow instead
# (src/ngx/NvOfSessionUnavailable.cpp).
name: build-windows

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**/*.md', 'docs/**', 'assets/**', '.github/workflows/checks.yml', '.github/workflows/screenshots.yml',
                   '.github/workflows/deps-probe.yml', '.github/workflows/upstream-inspect.yml']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish this build as a pre-release with this tag (vX.Y.Z, e.g. v2.1.5). Leave empty for a test build.'
        required: false
        default: ''

permissions:
  contents: read

# One build at a time per branch: a second push waits and then reuses the FFmpeg cache.
concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: false

env:
  UPSTREAM_REPO: Likely7/Veyra-NRVideo
  UPSTREAM_TAG: v2.1.5
  VCPKG_COMMIT: 30ef65cad98f08e7197c9a1656fbd871bcb72f2d   # builtin-baseline in vcpkg.json: FFmpeg 9.0.1
  DLSS_TAG: v310.7.0
  NVCODEC_TAG: n13.0.19.0
  CUDART_ZIP: https://developer.download.nvidia.com/compute/cuda/redist/cuda_cudart/windows-x86_64/cuda_cudart-windows-x86_64-12.9.79-archive.zip
  XESS_TAG: v3.0.2
  FFX1_TAG: v1.1.4
  FFX2_TAG: v2.3.0

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 240
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
      DEPS: D:\deps
      BUILD: D:\b
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # A release tag (v2.1.5) builds exactly that version; every other build is 2.1.5-pushfps.<run>.
      - name: Version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -and $tag -notmatch '^v\d+\.\d+\.\d+$') { throw "release_tag must look like v2.1.5" }
          if ($tag) { $v = $tag.TrimStart('v') }
          elseif ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.TrimStart('v') }
          else { $v = "2.1.5-pushfps.$env:GITHUB_RUN_NUMBER" }
          "PUSHFPS_VERSION=$v" | Out-File -Append $env:GITHUB_ENV
          New-Item -ItemType Directory -Force $env:DEPS | Out-Null
          Write-Host "PushFPS $v"

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Qt 6.8.3 (MSVC 2022 x64)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          dir: D:\
          cache: true

      - name: NVIDIA DLSS SDK ${{ env.DLSS_TAG }} (headers + static NGX library)
        working-directory: D:\deps
        shell: bash
        run: |
          GIT_LFS_SKIP_SMUDGE=1 git clone -q --depth 1 --branch "$DLSS_TAG" --filter=blob:none --sparse https://github.com/NVIDIA/DLSS.git dlss
          git -C dlss sparse-checkout set include lib/Windows_x86_64/x64
          test -f dlss/include/nvsdk_ngx.h && test -f dlss/lib/Windows_x86_64/x64/nvsdk_ngx_s.lib

      - name: NVENC headers, CUDA driver header, XeSS, FidelityFX
        working-directory: D:\deps
        shell: bash
        run: |
          set -e
          git clone -q --depth 1 --branch "$NVCODEC_TAG" https://github.com/FFmpeg/nv-codec-headers.git nv-codec-headers
          curl -sSfL "$CUDART_ZIP" -o cudart.zip && unzip -q cudart.zip -d cudart && mv cudart/*/ cudart-root
          test -f cudart-root/include/cuda.h
          gh release download "$XESS_TAG" -R intel/xess -p '*.zip' -O xess.zip && unzip -q xess.zip -d xess
          find xess -name xefg_swapchain_d3d12.h | head -1
          GIT_LFS_SKIP_SMUDGE=1 git clone -q --depth 1 --branch "$FFX2_TAG" --filter=blob:none --sparse https://github.com/GPUOpen-LibrariesAndSDKs/FidelityFX-SDK.git ffx2
          git -C ffx2 sparse-checkout set Kits/FidelityFX/api/include Kits/FidelityFX/framegeneration/include Kits/FidelityFX/upscalers/include
          gh release download "$FFX1_TAG" -R GPUOpen-LibrariesAndSDKs/FidelityFX-SDK -p '*.zip' -O ffx1.zip && unzip -q ffx1.zip -d ffx1

      # FidelityFX 1.1.4 ships source only. Build the optical flow + DX12 backend static libraries with the
      # static C runtime (/MT), as PushFPS links it; they land in sdk/bin/ffx_sdk where CMakeLists.txt looks.
      - name: Build FidelityFX 1.1.4 optical flow (static)
        working-directory: D:\deps\ffx1\sdk
        run: |
          cmake -S . -B build -A x64 -DFFX_API_BACKEND=DX12_X64 -DFFX_ALL=OFF -DFFX_OF=ON -DFFX_AUTO_COMPILE_SHADERS=1 `
            -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem bin\ffx_sdk -Filter *.lib | Format-Table Name, Length

      - name: Locate SDK roots
        shell: bash
        run: |
          xess=$(dirname "$(dirname "$(dirname "$(find /d/deps/xess -name xefg_swapchain_d3d12.h | head -1)")")")
          ffx1lib=$(find /d/deps/ffx1/sdk/bin -iname 'ffx_opticalflow_x64.lib' | head -1)
          ffx1=""; [ -n "$ffx1lib" ] && ffx1=$(dirname "$(dirname "$(dirname "$ffx1lib")")")
          {
            echo "XESS_ROOT=$(cygpath -m "$xess")"
            echo "FFX1_ROOT=$( [ -n "$ffx1" ] && cygpath -m "$ffx1" )"
          } >> "$GITHUB_ENV"
          echo "XeSS root: $xess"; echo "FidelityFX 1.x root: ${ffx1:-not found}"
          if [ -z "$ffx1" ]; then echo "::error::FidelityFX 1.1.4 optical flow libraries not found; PushFPS needs them for optical flow"; exit 1; fi

      # Restore and save are separate steps: actions/cache only saves when the whole job succeeds,
      # and FFmpeg takes ~40 minutes to build, so it is saved as soon as it is built.
      - name: Restore vcpkg binaries
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: D:\deps\vcpkg-binary
          key: vcpkg-ffmpeg-${{ env.VCPKG_COMMIT }}-avfilter-v1

      - name: FFmpeg 9.0.1 (vcpkg at the pinned baseline)
        working-directory: D:\deps
        run: |
          git init -q vcpkg; git -C vcpkg remote add origin https://github.com/microsoft/vcpkg.git
          git -C vcpkg fetch -q --depth 1 origin $env:VCPKG_COMMIT; git -C vcpkg checkout -q FETCH_HEAD
          & vcpkg\bootstrap-vcpkg.bat -disableMetrics
          New-Item -ItemType Directory -Force vcpkg-binary | Out-Null
          $env:VCPKG_DEFAULT_BINARY_CACHE = "$env:DEPS\vcpkg-binary"
          & vcpkg\vcpkg.exe install "ffmpeg[core,avcodec,avformat,avfilter,swresample,swscale]:x64-windows" --clean-after-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem vcpkg\installed\x64-windows\bin\av*.dll, vcpkg\installed\x64-windows\bin\sw*.dll | Format-Table Name, Length

      - name: Save vcpkg binaries
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: D:\deps\vcpkg-binary
          key: vcpkg-ffmpeg-${{ env.VCPKG_COMMIT }}-avfilter-v1

      - name: Configure
        run: |
          $ffmpeg = "$env:DEPS\vcpkg\installed\x64-windows"
          cmake -S . -B $env:BUILD -G Ninja -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR;$ffmpeg" `
            -DVEYRA_BUILD_QML_UI=ON -DVEYRA_ENABLE_EXPERIMENTAL_DLSSNR=ON -DVEYRA_ENABLE_D3D12_DEBUG=OFF `
            -DVEYRA_ENABLE_REMOTEPLAY=OFF -DVEYRA_ENABLE_MOONLIGHT=OFF -DVEYRA_ENABLE_XBOX=OFF `
            "-DVEYRA_DISPLAY_VERSION=$env:PUSHFPS_VERSION" `
            "-DVEYRA_FFMPEG_ROOT=$ffmpeg" `
            "-DVEYRA_DLSS_SDK_ROOT=$env:DEPS\dlss" `
            "-DVEYRA_NVENC_HEADERS_ROOT=$env:DEPS\nv-codec-headers" `
            "-DVEYRA_CUDA_DRIVER_INCLUDE_DIR=$env:DEPS\cudart-root\include" `
            "-DVEYRA_XESS_ROOT=$env:XESS_ROOT" `
            "-DVEYRA_FIDELITYFX_ROOT=$env:FFX1_ROOT" `
            "-DVEYRA_FIDELITYFX2_ROOT=$env:DEPS\ffx2\Kits\FidelityFX"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build PushFPS.exe
        run: |
          cmake --build $env:BUILD --target veyra_qml_ui --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item "$env:BUILD\PushFPS.exe" | Format-List Name, Length, VersionInfo

      - name: Unit tests that need no GPU
        run: |
          cmake --build $env:BUILD --target veyra_update_checker_tests veyra_ui_i18n_tests --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH = "$env:QT_ROOT_DIR\bin;$env:PATH"
          $failed = 0
          foreach ($t in 'veyra_update_checker_tests', 'veyra_ui_i18n_tests') {
            $exe = Get-ChildItem $env:BUILD -Recurse -Filter "$t.exe" | Select-Object -First 1
            if (-not $exe) { Write-Host "::error::$t.exe not built"; $failed++; continue }
            & $exe.FullName -o "$t.txt,txt" 2>&1 | Out-Host
            $code = $LASTEXITCODE
            if (Test-Path "$t.txt") { Get-Content "$t.txt" | Out-Host }
            Write-Host "$t exit $code"
            if ($code -ne 0) { $failed++ }
          }
          if ($failed) { exit 1 }

      - name: QML component tests (PushFPS quick setup)
        run: |
          cmake --build $env:BUILD --target veyra_qml_quick_tests veyra_qml_easing_tests --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $stage = Join-Path $env:RUNNER_TEMP 'qml-tests-stage'
          New-Item -ItemType Directory -Force $stage | Out-Null
          foreach ($t in 'veyra_qml_quick_tests', 'veyra_qml_easing_tests') {
            $exe = Get-ChildItem $env:BUILD -Recurse -Filter "$t.exe" | Select-Object -First 1
            if (-not $exe) { Write-Host "::error::$t.exe not built"; exit 1 }
            Copy-Item $exe.FullName $stage
          }
          Copy-Item -Recurse -Force qml (Join-Path $stage 'qml')
          Copy-Item -Recurse -Force tests\qml\quick (Join-Path $stage 'qml-tests')
          $env:PATH = "$env:QT_ROOT_DIR\bin;$env:PATH"
          $env:QML_IMPORT_PATH = "$env:QT_ROOT_DIR\qml"
          $env:QT_PLUGIN_PATH = "$env:QT_ROOT_DIR\plugins"
          $env:QT_QUICK_BACKEND = 'software'
          $env:QML_DISABLE_DISK_CACHE = '1'
          Push-Location $stage
          & .\veyra_qml_quick_tests.exe -platform offscreen -input qml-tests\tst_push_quick_setup.qml -o push-quick.txt,txt 2>&1 | Out-Host
          $code = $LASTEXITCODE
          Get-Content push-quick.txt -ErrorAction SilentlyContinue | Out-Host
          if ((Get-Content push-quick.txt -Raw -ErrorAction SilentlyContinue) -notmatch 'Totals: [1-9]\d* passed, 0 failed') { $code = 1 }
          Pop-Location
          Write-Host "tst_push_quick_setup exit $code"
          if ($code -ne 0) { exit 1 }

      - name: QML component tests (whole Veyra suite)
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'qml-tests-stage'
          $env:PATH = "$env:QT_ROOT_DIR\bin;$env:PATH"
          $env:QML_IMPORT_PATH = "$env:QT_ROOT_DIR\qml"
          $env:QT_PLUGIN_PATH = "$env:QT_ROOT_DIR\plugins"
          $env:QT_QUICK_BACKEND = 'software'
          $env:QML_DISABLE_DISK_CACHE = '1'
          Push-Location $stage
          $env:VEYRA_QML_DIR = Join-Path $stage 'qml'
          & .\veyra_qml_easing_tests.exe -platform offscreen 2>&1 | Out-Host
          Write-Host "veyra_qml_easing_tests exit $LASTEXITCODE"
          $failed = 0
          foreach ($f in Get-ChildItem qml-tests -Filter 'tst_*.qml') {
            $res = "result-$($f.BaseName).txt"
            & .\veyra_qml_quick_tests.exe -platform offscreen -input "qml-tests\$($f.Name)" -o "$res,txt" 2>&1 | Out-Null
            $code = $LASTEXITCODE
            $out = Get-Content $res -ErrorAction SilentlyContinue
            $totals = ($out | Select-String '^Totals:' | Select-Object -Last 1).Line
            Write-Host ("{0,-34} exit {1}  {2}" -f $f.Name, $code, $totals)
            if ($code -ne 0) { $failed++; $out | Select-String -Context 0,3 'FAIL!' | Select-Object -First 15 | Out-Host }
          }
          Pop-Location
          Write-Host "files with failures: $failed"
          if ($failed) { exit 1 }

      - name: Imports must match the upstream runtime package
        run: |
          python -m pip install --quiet pefile
          @'
          import pefile, sys
          pe = pefile.PE(sys.argv[1], fast_load=True)
          pe.parse_data_directories(directories=[pefile.DIRECTORY_ENTRY["IMAGE_DIRECTORY_ENTRY_IMPORT"]])
          names = sorted(e.dll.decode().lower() for e in pe.DIRECTORY_ENTRY_IMPORT)
          print("\n".join(names))
          ffmpeg = ("avcodec-", "avformat-", "avutil-", "avfilter-", "avdevice-", "swresample-", "swscale-", "dav1d")
          app = [n for n in names if n.startswith(("qt6",) + ffmpeg)]
          expected = {"qt6core.dll","qt6gui.dll","qt6network.dll","qt6qml.dll","qt6quick.dll","qt6widgets.dll",
                      "avcodec-63.dll","avformat-63.dll","avutil-61.dll","swresample-7.dll","swscale-10.dll"}
          extra = sorted(set(app) - expected)
          if extra: sys.exit(f"PushFPS.exe imports libraries the Veyra package does not ship: {extra}")
          print("OK: every Qt / FFmpeg import is shipped by the Veyra runtime package")
          '@ | Out-File -Encoding utf8 imports.py
          python imports.py "$env:BUILD\PushFPS.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Pin the upstream package hashes
        run: |
          gh release download $env:UPSTREAM_TAG -R $env:UPSTREAM_REPO -p SHA256SUMS.txt -O upstream-sha256.txt
          Get-Content upstream-sha256.txt

      - name: Package the PushFPS release zip
        run: |
          ./packaging/make-release.ps1 -BuildDir $env:BUILD -Version $env:PUSHFPS_VERSION `
            -UpstreamRepo $env:UPSTREAM_REPO -UpstreamTag $env:UPSTREAM_TAG -UpstreamSums upstream-sha256.txt -OutDir dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist | Format-Table Name, Length

      - name: Install test (download Veyra runtime, add PushFPS, start it)
        timeout-minutes: 30
        run: |
          $zip = (Get-ChildItem dist/PushFPS-*.zip)[0].FullName
          Expand-Archive $zip -DestinationPath D:\pf-zip
          & D:\pf-zip\Install-PushFPS.ps1 -Gpu NVIDIA -InstallDir D:\pf-install -NoShortcuts -NoLaunch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path D:\pf-install\PushFPS.exe)) { throw "PushFPS.exe missing after install" }
          # Start it and make sure Windows resolves every DLL and the program reaches its QML session.
          $p = Start-Process D:\pf-install\PushFPS.exe -PassThru
          Start-Sleep -Seconds 25
          $alive = -not $p.HasExited
          if (-not $alive) { Write-Host "exit code: $($p.ExitCode)" }
          Get-ChildItem D:\pf-install\logs -ErrorAction SilentlyContinue | ForEach-Object { "=== $($_.Name)"; Get-Content $_.FullName -Tail 60 }
          if ($alive) { Stop-Process -Id $p.Id -Force }
          $log = Get-ChildItem D:\pf-install\logs -Filter *.log -ErrorAction SilentlyContinue | Get-Content -Raw
          if ($log -notmatch 'PushFPS QML session started') { throw "PushFPS did not reach its QML session (no GPU on this runner is fine; a missing DLL or entry point is not)" }
          $qmlErrors = @(($log -split "`n") | Where-Object { $_ -match '\[ERROR\] \[qml\]' })
          if ($qmlErrors.Count) { $qmlErrors | ForEach-Object { Write-Host "::error::$_" }; throw "The interface logged QML errors at startup" }
          Write-Host "PushFPS started and loaded its interface with no QML errors."
          # Every main page and the capture dialog, each in a fresh profile: no QML errors either.
          $pages = @(@('--page', 'pro', '--tab', 'fg'), @('--page', 'pro', '--tab', 'quality'), @('--page', 'pro', '--tab', 'display'),
                     @('--page', 'set'), @('--page', 'min'), @('--page', 'exp'), @('--page', 'home', '--dialog', 'capture'))
          $i = 0
          foreach ($pa in $pages) {
            $i++
            $env:VEYRA_LOG_FILE = "D:\pf-pages\page-$i.log"
            New-Item -ItemType Directory -Force D:\pf-pages | Out-Null
            $q = Start-Process D:\pf-install\PushFPS.exe -PassThru -ArgumentList ($pa + @('--data-dir', "D:\pf-pages\data-$i", '--exit-after', '12000'))
            if (-not $q.WaitForExit(40000)) { Stop-Process -Id $q.Id -Force }
            $plog = Get-Content "D:\pf-pages\page-$i.log" -Raw -ErrorAction SilentlyContinue
            if ($plog -notmatch 'PushFPS QML session started') { throw "$($pa -join ' '): no QML session" }
            $errs = @(($plog -split "`n") | Where-Object { $_ -match '\[ERROR\] \[qml\]' })
            if ($errs.Count) { $errs | ForEach-Object { Write-Host "::error::$($pa -join ' '): $_" }; throw "QML errors on $($pa -join ' ')" }
            Write-Host "$($pa -join ' '): no QML errors"
          }
          Remove-Item Env:VEYRA_LOG_FILE

      - uses: actions/upload-artifact@v4
        with:
          name: PushFPS-${{ env.PUSHFPS_VERSION }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  # PushFPS for OBS Studio (obs-plugin/): built against OBS's public headers, then loaded into a
  # real OBS Studio (latest release) with a scene that holds a PushFPS source, and the OBS log is
  # checked for the plugin loading, the source being created and its capture child starting.
  obs-plugin:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
      OBS_HEADERS_TAG: 31.0.0
      OBS_PLUGIN_VERSION: 1.0.0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: OBS headers (obs-studio ${{ env.OBS_HEADERS_TAG }}, libobs + frontend API only)
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse --branch $env:OBS_HEADERS_TAG https://github.com/obsproject/obs-studio.git D:\obs-src
          git -C D:\obs-src sparse-checkout set libobs UI/obs-frontend-api frontend/api
          if (-not (Test-Path D:\obs-src\libobs\obs-module.h)) { throw 'libobs headers missing' }

      - name: Build pushfps-obs.dll
        run: |
          cmake -S obs-plugin -B D:\obs-build -G "Visual Studio 17 2022" -A x64 "-DOBS_SOURCE_DIR=D:\obs-src"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build D:\obs-build --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exports and imports
        run: |
          $dll = 'D:\obs-build\Release\pushfps-obs.dll'
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe | Where-Object FullName -match 'Hostx64\\x64' | Select-Object -First 1
          $exports = & $dumpbin.FullName /nologo /exports $dll | Out-String
          $imports = & $dumpbin.FullName /nologo /imports $dll | Out-String
          $exports; $imports
          foreach ($e in 'obs_module_load', 'obs_module_ver', 'obs_module_set_pointer', 'obs_module_post_load', 'obs_module_name') {
            if ($exports -notmatch "\b$e\b") { throw "missing export $e" }
          }
          foreach ($i in 'obs.dll', 'obs-frontend-api.dll') { if ($imports -notmatch [regex]::Escape($i)) { throw "missing import $i" } }

      - name: Package
        run: |
          $root = "D:\obs-pkg\PushFPS-OBS-Plugin-$env:OBS_PLUGIN_VERSION-win64"
          New-Item -ItemType Directory -Force "$root\pushfps-obs\bin\64bit" | Out-Null
          Copy-Item D:\obs-build\Release\pushfps-obs.dll "$root\pushfps-obs\bin\64bit\"
          Copy-Item obs-plugin\packaging\* $root
          Copy-Item LICENSE "$root\LICENSE.txt"
          New-Item -ItemType Directory -Force dist | Out-Null
          $zip = "dist\PushFPS-OBS-Plugin-$env:OBS_PLUGIN_VERSION-win64.zip"
          Compress-Archive -Path "$root\*" -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $(Split-Path $zip -Leaf)" | Set-Content "$zip.sha256" -Encoding ascii
          Get-ChildItem dist | Format-Table Name, Length

      - name: Load test in real OBS Studio
        run: |
          $pkg = (Get-ChildItem D:\obs-pkg -Directory | Select-Object -First 1).FullName
          ./obs-plugin/ci/obs-load-test.ps1 -PackageDir $pkg -StopWhen 'capture method' `
            -Expect '\[pushfps-obs\] loaded version', '\[pushfps-obs\] source created',
                    '\[pushfps-obs\] capture method: game_capture', '\[pushfps-obs\] PushFPS is not running yet'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: obs-load-test-log
          path: D:\obs-logs
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: PushFPS-OBS-Plugin
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  # End to end: PushFPS installed in its default folder, the OBS plugin installed, OBS opens a scene with a
  # PushFPS source, the source starts PushFPS itself (--obs-game-capture), finds its window and hands it to
  # OBS game capture. No GPU here, so there is no picture to receive; the steps up to the hook are checked.
  obs-integration:
    needs: [build, obs-plugin]
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Install PushFPS (default folder) and unpack the plugin
        run: |
          $zip = Get-ChildItem art -Recurse -Filter 'PushFPS-*-win64.zip' | Where-Object Name -notmatch 'OBS-Plugin' | Select-Object -First 1
          $obsZip = Get-ChildItem art -Recurse -Filter 'PushFPS-OBS-Plugin-*.zip' | Select-Object -First 1
          Expand-Archive $zip.FullName D:\pf-zip
          & D:\pf-zip\Install-PushFPS.ps1 -Gpu NVIDIA -NoShortcuts -NoLaunch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\PushFPS\PushFPS.exe")) { throw 'PushFPS.exe not in the default folder' }
          Expand-Archive $obsZip.FullName D:\obs-pkg
      - name: OBS starts PushFPS and captures it
        run: |
          ./obs-plugin/ci/obs-load-test.ps1 -PackageDir D:\obs-pkg -Seconds 150 -StopWhen 'found the PushFPS window' `
            -Expect '\[pushfps-obs\] source created', '\[pushfps-obs\] auto start: started', '\[pushfps-obs\] found the PushFPS window'
          $pf = Get-Process PushFPS -ErrorAction SilentlyContinue
          $plog = Get-Content "$env:LOCALAPPDATA\Programs\PushFPS\logs\veyra-qml.log" -Raw -ErrorAction SilentlyContinue
          ($plog -split "`n") | Where-Object { $_ -match 'obs|OBS|renderer|session started' } | Select-Object -First 30 | Out-Host
          if ($pf) { $pf | Stop-Process -Force }
          if ($plog -notmatch 'PushFPS QML session started') { throw 'PushFPS (started by OBS) did not reach its QML session' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: obs-integration-log
          path: D:\obs-logs
          if-no-files-found: ignore

  # Publishes a tagged build as a GitHub pre-release. It stays a pre-release (which the in-app update
  # checker ignores) until someone has tested it on real hardware and marks it as the latest release.
  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: [build, obs-plugin]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the pre-release
        run: |
          ls -la dist
          zip=$(ls dist/PushFPS-*-win64.zip | grep -v OBS-Plugin | head -1); sum=$(cat "$zip.sha256")
          obszip=$(ls dist/PushFPS-OBS-Plugin-*.zip | head -1); obssum=$(cat "$obszip.sha256")
          cat > notes.md <<NOTES
          ## Install

          1. Download **$(basename "$zip")** below and extract it.
          2. Double-click **Install-PushFPS.cmd**.

          The installer downloads Veyra's official runtime package (about 750 MB, NVIDIA or AMD to match your
          graphics card) from Veyra's GitHub release, checks its SHA-256, and installs PushFPS with Start menu
          and desktop shortcuts. No administrator rights needed.

          **Preview build.** Built and start-tested automatically on Windows; not yet tested with a real
          capture card and GPU. Please report what works and what doesn't in Issues.

          SHA-256: \`$sum\`

          ## OBS Studio plugin

          **$(basename "$obszip")** adds a *PushFPS* source to OBS Studio 28+ (Windows): your PushFPS picture,
          frame generation included, in any scene. Extract it and double-click **Install-PushFPS-OBS.cmd**.

          SHA-256: \`$obssum\`

          PushFPS is free software (GPL-3.0), built on [Veyra](https://github.com/Likely7/Veyra-NRVideo) by Likely7.
          NOTES
          # A manual run creates the tag on the commit it built; a tag push already has it.
          gh release create "$TAG" dist/* -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "PushFPS $TAG" \
            --notes-file notes.md --prerelease
